<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Australia — Top Cuisine by State (Pattern Fill)</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega/v5.json",
      "width": 920,
      "height": 700,
      "projections": [
        {
          "name": "proj",
          "type": "mercator",
          "fit": {"signal": "data('states')"}
        }
      ],
      "data": [
        {
          "name": "states",
          "url": "states.geojson",
          "format": {"type": "json", "property": "features"}
        },
        {
          "name": "cuisine",
          "values": [
            {"state":"NSW","icon":"img/Thailand.png"},
            {"state":"NT","icon":"img/China.png"},
            {"state":"QLD","icon":"img/Japan.png"},
            {"state":"SA","icon":"img/Korea.png"},
            {"state":"TAS","icon":"img/China.png"},
            {"state":"VIC","icon":"img/China.png"},
            {"state":"WA","icon":"img/India.png"}
          ]
        }
      ],
      "marks": [
        {
          "type": "shape",
          "from": {"data": "states"},
          "encode": {
            "enter": {
              "stroke": {"value": "#374151"},
              "strokeWidth": {"value": 1.2},
              "tooltip": {"signal": "datum.properties.STATE_NAME"}
            },
            "update": {
              "fill": {
                "signal": "pattern('url(' + lookup('cuisine', datum.properties.STATE_NAME, 'state').icon + ')')"
              }
            }
          },
          "transform": [
            {"type": "geoshape", "projection": "proj"}
          ]
        }
      ]
    };

    vegaEmbed("#vis", spec, {actions:false});
  </script>
</body>
</html>
