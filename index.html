<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Australia — Top Restaurant Cuisine by State</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 24px; }
    #vis { max-width: 960px; margin: 0 auto; }
    h2 { text-align: center; margin: 0 0 12px 0; }
    .legend { max-width: 960px; margin: 12px auto 0; display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:#374151; }
    .legend-item { display:flex; align-items:center; gap:6px; }
    .legend-item img { width:22px; height:22px; border-radius:4px; display:block; }
    .footer { max-width: 960px; margin: 12px auto 0; color:#6b7280; font-size: 13px; text-align:center; }
  </style>
</head>
<body>
  <h2>Australia — Top Restaurant Cuisine by State</h2>
  <div id="vis"></div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 920,
      "height": 700,
      "projection": {"type": "mercator"},
      "layer": [
        {
          "data": {
  "url": "states.geojson",
  "format": { "type": "json", "property": "features" }
},
          "mark": { "type":"geoshape", "fill":"#e5e7eb", "stroke":"#374151", "strokeWidth": 1.2 }
        },
        {
          "data": {
            "values": [
              {"state":"NSW","cuisine":"Thai","iconFile":"Thailand.png","lat":-33.8688,"lon":151.2093},
              {"state":"NT","cuisine":"Chinese","iconFile":"China.png","lat":-12.4634,"lon":130.8456},
              {"state":"QLD","cuisine":"Japanese","iconFile":"Japan.png","lat":-27.4698,"lon":153.0251},
              {"state":"SA","cuisine":"Korean","iconFile":"Korea.png","lat":-34.9285,"lon":138.6007},
              {"state":"TAS","cuisine":"Chinese","iconFile":"China.png","lat":-42.8821,"lon":147.3272},
              {"state":"VIC","cuisine":"Chinese","iconFile":"China.png","lat":-37.8136,"lon":144.9631},
              {"state":"WA","cuisine":"Indian","iconFile":"India.png","lat":-31.9523,"lon":115.8613}
            ]
          },
          "transform": [
            {"calculate": "'img/' + datum.iconFile", "as": "iconUrl"}
          ],
          "mark": { "type": "image", "width": 72, "height": 72 },
          "encoding": {
            "longitude": {"field": "lon", "type": "quantitative"},
            "latitude": {"field": "lat", "type": "quantitative"},
            "url": {"field": "iconUrl"},
            "tooltip": [
              {"field":"state","title":"State"},
              {"field":"cuisine","title":"Top cuisine"}
            ]
          }
        },
        {
          "data": {
            "values": [
              {"label":"WA","lat":-25.5,"lon":121.0},
              {"label":"NT","lat":-19.0,"lon":133.0},
              {"label":"SA","lat":-30.5,"lon":135.0},
              {"label":"QLD","lat":-20.5,"lon":145.5},
              {"label":"NSW","lat":-31.8,"lon":147.0},
              {"label":"VIC","lat":-36.6,"lon":145.5},
              {"label":"TAS","lat":-41.7,"lon":146.5}
            ]
          },
          "mark": {"type":"text","fontSize":12,"fill":"#374151","fontWeight":"bold"},
          "encoding": {
            "longitude": {"field":"lon","type":"quantitative"},
            "latitude": {"field":"lat","type":"quantitative"},
            "text": {"field":"label"}
          }
        }
      ]
    };

    vegaEmbed('#vis', spec, {actions:false});
  </script>

  <div class="legend" aria-label="Legend">
    <span style="font-weight:600;">Legend:</span>
    <span class="legend-item"><img src="img/China.png" alt="Chinese"/> Chinese</span>
    <span class="legend-item"><img src="img/Japan.png" alt="Japanese"/> Japanese</span>
    <span class="legend-item"><img src="img/India.png" alt="Indian"/> Indian</span>
    <span class="legend-item"><img src="img/Korea.png" alt="Korean"/> Korean</span>
    <span class="legend-item"><img src="img/Thailand.png" alt="Thai"/> Thai</span>
  </div>

  <div class="footer">Visualisation by Yifei Wang • Built with Vega-Lite</div>
</body>
</html>
