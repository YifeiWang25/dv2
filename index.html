<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Australia — Top Restaurant Cuisine by State</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 24px; }
    #vis { max-width: 960px; margin: 0 auto; }
    h2 { text-align: center; margin: 0 0 12px 0; }
    .footer { max-width: 960px; margin: 12px auto 0; color:#6b7280; font-size: 13px; text-align:center; }
  </style>
</head>
<body>
  <h2>Australia — Top Restaurant Cuisine by State</h2>
  <div id="vis"></div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 920,
      "height": 700,
      "projection": {"type": "mercator"},
      "layer": [
        {
          "data": { "url": "states.geojson", "format": { "type": "json", "property": "features" } },
          "transform": [
            {
              "lookup": "properties.STATE_NAME",
              "from": {
                "data": {
                  "values": [
                    {"state":"New South Wales","color":"#22c55e"},   /* Thai - green */
                    {"state":"Northern Territory","color":"#ef4444"},/* Chinese - red */
                    {"state":"Queensland","color":"#ffffff"},        /* Japanese - white */
                    {"state":"South Australia","color":"#3b82f6"},   /* Korean - blue */
                    {"state":"Tasmania","color":"#ef4444"},          /* Chinese - red */
                    {"state":"Victoria","color":"#ef4444"},          /* Chinese - red */
                    {"state":"Western Australia","color":"#facc15"}  /* Indian - yellow */
                  ]
                },
                "key": "state",
                "fields": ["color"]
              }
            }
          ],
          "mark": {"type":"geoshape","stroke":"#374151","strokeWidth":1.2},
          "encoding": { "color": {"field": "color", "type": "nominal", "scale": null} }
        },

        /* --- 小图标层：VIC、TAS 用 50x50 --- */
        {
          "data": {
            "values": [
              {"state":"Victoria","cuisine":"Chinese","iconFile":"China.png","lat":-36.5,"lon":145.0},
              {"state":"Tasmania","cuisine":"Chinese","iconFile":"China.png","lat":-42.0,"lon":146.5}
            ]
          },
          "transform": [{ "calculate": "'img/' + datum.iconFile", "as": "iconUrl" }],
          "mark": { "type": "image", "width": 50, "height": 50 },
          "encoding": {
            "longitude": {"field": "lon", "type": "quantitative"},
            "latitude": {"field": "lat", "type": "quantitative"},
            "url": {"field": "iconUrl"},
            "tooltip": [{"field":"state"},{"field":"cuisine"}]
          }
        },

        /* --- 大图标层：其余州 100x100，含 QLD/SA 的位置微调 --- */
        {
          "data": {
            "values": [
              {"state":"New South Wales","cuisine":"Thai","iconFile":"Thailand.png","lat":-32.0,"lon":147.0},
              {"state":"Northern Territory","cuisine":"Chinese","iconFile":"China.png","lat":-19.0,"lon":133.0},
              /* QLD 往左下：lon 小一点，lat 更负一点 */
              {"state":"Queensland","cuisine":"Japanese","iconFile":"Japan.png","lat":-20.8,"lon":145.2},
              /* SA 往上：lat 接近 0（数值增大、绝对值变小）*/
              {"state":"South Australia","cuisine":"Korean","iconFile":"Korea.png","lat":-30.2,"lon":135.0},
              {"state":"Western Australia","cuisine":"Indian","iconFile":"India.png","lat":-25.5,"lon":121.0}
            ]
          },
          "transform": [{ "calculate": "'img/' + datum.iconFile", "as": "iconUrl" }],
          "mark": { "type": "image", "width": 100, "height": 100 },
          "encoding": {
            "longitude": {"field": "lon", "type": "quantitative"},
            "latitude": {"field": "lat", "type": "quantitative"},
            "url": {"field": "iconUrl"},
            "tooltip": [{"field":"state"},{"field":"cuisine"}]
          }
        }
      ]
    };

    vegaEmbed('#vis', spec, {actions:false});
  </script>

  <div class="footer">Visualisation by Yifei Wang • Built with Vega-Lite</div>
</body>
</html>
