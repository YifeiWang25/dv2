<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Australia — Top Restaurant Cuisine by State</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 24px; text-align: center; }
    #vis { display: inline-block; }
    h2 { margin: 0 0 12px 0; }
    .legend { margin-top: 20px; display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .color-box { width: 18px; height: 18px; border: 1px solid #374151; }
    .legend-icon { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; }
    .footer { margin-top: 12px; color:#6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Australia — Top Restaurant Cuisine by State</h2>
  <div id="vis"></div>

  <!-- 图例 -->
  <div class="legend">
    <div class="legend-item"><div class="color-box" style="background:#22c55e;"></div><img src="img/Thailand.png" class="legend-icon">Thai</div>
    <div class="legend-item"><div class="color-box" style="background:#ef4444;"></div><img src="img/China.png" class="legend-icon">Chinese</div>
    <div class="legend-item"><div class="color-box" style="background:#ffffff;"></div><img src="img/Japan.png" class="legend-icon">Japanese</div>
    <div class="legend-item"><div class="color-box" style="background:#3b82f6;"></div><img src="img/Korea.png" class="legend-icon">Korean</div>
    <div class="legend-item"><div class="color-box" style="background:#facc15;"></div><img src="img/India.png" class="legend-icon">Indian</div>
  </div>

  <div class="footer">Visualisation by Yifei Wang • Built with Vega-Lite</div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 920,
      "height": 700,
      "autosize": {"type": "fit", "contains": "padding"},
      "projection": {"type": "mercator"},
      "layer": [
        {
          "data": { "url": "states.geojson", "format": { "type": "json", "property": "features" } },
          "transform": [
            {
              "lookup": "properties.STATE_NAME",
              "from": {
                "data": {
                  "values": [
                    {"state":"New South Wales","color":"#22c55e"},
                    {"state":"Northern Territory","color":"#ef4444"},
                    {"state":"Queensland","color":"#ffffff"},
                    {"state":"South Australia","color":"#3b82f6"},
                    {"state":"Tasmania","color":"#ef4444"},
                    {"state":"Victoria","color":"#ef4444"},
                    {"state":"Western Australia","color":"#facc15"}
                  ]
                },
                "key": "state",
                "fields": ["color"]
              }
            }
          ],
          "mark": {"type":"geoshape","stroke":"#374151","strokeWidth":1.2},
          "encoding": { "color": {"field": "color", "type": "nominal", "scale": null} }
        },
        /* VIC、TAS 小图标 */
        {
          "data": {
            "values": [
              {"state":"Victoria","cuisine":"Chinese","iconFile":"China.png","lat":-36.5,"lon":145.0},
              {"state":"Tasmania","cuisine":"Chinese","iconFile":"China.png","lat":-42.0,"lon":146.5}
            ]
          },
          "transform": [{ "calculate": "'img/' + datum.iconFile", "as": "iconUrl" }],
          "mark": { "type": "image", "width": 50, "height": 50 },
          "encoding": {
            "longitude": {"field": "lon"}, "latitude": {"field": "lat"}, "url": {"field": "iconUrl"},
            "tooltip": [{"field":"state"},{"field":"cuisine"}]
          }
        },
        /* 其他州大图标（QLD/SA 微调） */
        {
          "data": {
            "values": [
              {"state":"New South Wales","cuisine":"Thai","iconFile":"Thailand.png","lat":-32.0,"lon":147.0},
              {"state":"Northern Territory","cuisine":"Chinese","iconFile":"China.png","lat":-19.0,"lon":133.0},
              {"state":"Queensland","cuisine":"Japanese","iconFile":"Japan.png","lat":-20.8,"lon":145.2}, /* 左下 */
              {"state":"South Australia","cuisine":"Korean","iconFile":"Korea.png","lat":-30.2,"lon":135.0}, /* 上移 */
              {"state":"Western Australia","cuisine":"Indian","iconFile":"India.png","lat":-25.5,"lon":121.0}
            ]
          },
          "transform": [{ "calculate": "'img/' + datum.iconFile", "as": "iconUrl" }],
          "mark": { "type": "image", "width": 100, "height": 100 },
          "encoding": {
            "longitude": {"field": "lon"}, "latitude": {"field": "lat"}, "url": {"field": "iconUrl"},
            "tooltip": [{"field":"state"},{"field":"cuisine"}]
          }
        }
      ]
    };
    vegaEmbed('#vis', spec, {actions:false});
  </script>
</body>
</html>
